# Personal Environment Settings

# Browser
exec firefox

# Bar Status Command
set $status_command ~/.cargo/bin/i3status-rs ~/.config/i3status-rs/config.toml

# Autotiling Layout Daemon
exec autotiling-rs

# Keyboard Layout: Swap Caps Lock and Left/Right Control
input "type:keyboard" {
    xkb_options ctrl:swapcaps
}
