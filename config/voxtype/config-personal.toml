state_file = "auto"

[hotkey]
# Disable internal hardware device monitoring to prevent input captures and execution conflicts.
# All dictation shortcut triggers are governed globally by the desktop compositor.
enabled = false
# key = "RIGHTCTRL"
# modifiers = []
mode = "toggle"
# model_modifier = "LEFTSHIFT"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[audio.feedback]
enabled = true
theme = "default"
volume = 0.6

[whisper]
model = "base.en"
secondary_model = "medium.en"
language = "en"
translate = false

threads = 10
on_demand_loading = false

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0
pre_type_delay_ms = 0

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = true

[text]
spoken_punctuation = true
replacements = { "vox type" = "voxtype" }
