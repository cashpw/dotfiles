- defaults:
    link:
      relink: true

- clean: ['~']

- create:
  - ~/.scripts
  - ~/.config
  - ~/.gemini
  - ~/.local/bin
  - ~/.local/share/zotra-server
  - ~/.local/share/icons/google-material

- link:
    ~/.config/:
      glob: true
      path: config/*
    ~/.gemini/:
      glob: true
      path: gemini/*
    ~/.var/:
      glob: true
      path: var/*
    ~/.scripts/:
      glob: true
      path: scripts/*
    ~/.local/share/zotra-server/:
      glob: true
      path: local/share/zotra-server/*
    ~/.local/share/icons/google-material/:
      glob: true
      path: local/share/icons/google-material/*
    ~/.Xresources:
    ~/.Xresources.base:
    ~/.profile:
    ~/.profile-personal:
    ~/.zshrc:
    ~/.bashrc:
    ~/.bashrc-personal:
    ~/.screenlayout:
    ~/.bash_aliases:
    ~/.chrome-remote-desktop-session:
    ~/.notmuch-config:
